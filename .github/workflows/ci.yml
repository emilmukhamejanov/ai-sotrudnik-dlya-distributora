name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff и pytest на Postgres 16 + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dala
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: dala
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dala -d dala"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Пароли только для одноразовой базы CI; ключей моделей тестам не нужно — модель в тестах заглушка.
      AGENT_DB_PASSWORD: ci-agent
      DATABASE_URL: postgresql://dala:ci-postgres@localhost:5432/dala
      TEST_DATABASE_URL: postgresql://dala:ci-postgres@localhost:5432/dala
      TEST_AGENT_DATABASE_URL: postgresql://agent_reader:ci-agent@localhost:5432/dala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Клиент psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Схемы, роль агента, демо-данные
        run: ./db/apply.sh
      - name: Зависимости
        run: pip install -e "backend[dev]"
      - name: Ruff
        run: ruff check backend && ruff format --check backend
      - name: Pytest (unit + интеграционные с базой)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend — типы, тесты, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t dala-agent:ci .
      - name: Образ стартует и отвечает
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=dala -e POSTGRES_PASSWORD=ci-postgres -e POSTGRES_DB=dala -e AGENT_DB_PASSWORD=ci-agent \
            -v "$PWD/db:/opt/db:ro" -v "$PWD/data/demo_1c:/opt/data/demo_1c:ro" \
            -v "$PWD/db/docker-init.sh:/docker-entrypoint-initdb.d/10-apply.sh:ro" \
            pgvector/pgvector:pg16
          for i in $(seq 1 60); do docker exec db pg_isready -h 127.0.0.1 -U dala -d dala && break; sleep 2; done
          docker run -d --name app --network ci -p 8000:8000 \
            -e DB_HOST=db -e POSTGRES_PASSWORD=ci-postgres -e AGENT_DB_PASSWORD=ci-agent \
            -e ANTHROPIC_API_KEY=not-used-in-smoke-test dala-agent:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/meta
          curl -fsS localhost:8000/ | grep -q "ИИ-сотрудник"
      - name: Логи при ошибке
        if: failure()
        run: docker logs app || true
