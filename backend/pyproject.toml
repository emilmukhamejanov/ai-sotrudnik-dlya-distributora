[project]
name = "dala-agent"
version = "0.1.0"
description = "ИИ-сотрудник для дистрибьютора: text-to-SQL по данным 1С, RAG по регламентам, действия в Битрикс24 (демо-кейс)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []  # зависимости агента (LangGraph, FastAPI, psycopg и т.д.) добавляются на этапе 2

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[project.scripts]
dala-demo-data = "dala_agent.demo_data.generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dala_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
