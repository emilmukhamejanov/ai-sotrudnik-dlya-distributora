services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-dala}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Задайте AGENT_DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/opt/db:ro
      - ./data/demo_1c:/opt/data/demo_1c:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-apply.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
