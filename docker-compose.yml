# База: docker compose up -d --wait db   (make db-up)
# Всё целиком — база, агент и дашборд: docker compose up -d --build --wait   (make up)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-dala}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Задайте AGENT_DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/opt/db:ro
      - ./data/demo_1c:/opt/data/demo_1c:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-apply.sh:ro
    healthcheck:
      # По TCP: во время первичной загрузки демо-данных Postgres слушает только сокет,
      # поэтому «готов» он будет, лишь когда данные загружены.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: dala-agent:latest
    env_file: .env
    environment:
      # Внутри compose агент ходит в базу из сервиса db, даже если в .env указана внешняя (Supabase).
      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: ""
      AGENT_DATABASE_URL: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Отчёты evals и журнал заглушки Битрикс24 — в папке var проекта, общей с обычным запуском.
      # На Linux-хосте папка должна быть доступна на запись пользователю с uid 1000.
      - ./var:/app/var
    restart: unless-stopped

volumes:
  pgdata:
