# ---------------------------------------------------------------- данные + документы
- id: mixed-01
  category: data_and_docs
  question: Кому из должников уже должны были заблокировать отгрузки?
  expect:
    route: [data_and_docs, data]
    reference_sql: >
      SELECT COUNT(DISTINCT client_id) FROM analytics.receivables WHERE days_overdue > 15 AND balance_kzt > 0
    citations_any: [kreditnaya-politika#4.1]

- id: mixed-02
  category: data_and_docs
  question: Есть ли просроченные партии, которые по регламенту уже должны были убрать в карантин?
  expect:
    route: [data_and_docs, data]
    # Два прочтения: все 7 просроченных партий — или 6, если учесть «один рабочий день» из п. 3.3
    # (макароны в Шымкенте просрочены с субботы 14.11 — срок перемещения наступает в понедельник).
    reference_sql:
      - SELECT COUNT(*) FROM analytics.stock WHERE is_expired
      - SELECT COUNT(*) FROM analytics.stock WHERE is_expired AND expiry_date <= DATE '2026-11-11'
    citations_any: [reglament-otgruzki#3.3]

# ---------------------------------------------------------------- действия в Битрикс24
- id: action-01
  category: action
  turns:
    - message: Поставь задачу Иванову позвонить клиенту с просрочкой
      expect:
        status: needs_confirmation
        pending: {kind: create_task, responsible_id: 11}
        side_effects: 0
    - confirm: true
      expect:
        status: done
        side_effects: 1

- id: action-02
  category: action
  turns:
    - message: Поставь задачу Петренко подготовить отчёт по возвратам
      expect:
        status: needs_clarification
        answer_contains: [Ержан, Динара]
        side_effects: 0
    - message: Динаре
      expect:
        status: needs_confirmation
        pending: {kind: create_task, responsible_id: 5}

- id: action-03
  category: action
  turns:
    - message: Создай задачу Калиевой проверить остатки молочки
      expect:
        status: needs_confirmation
        pending: {kind: create_task, responsible_id: 7}
    - reject: true
      expect:
        side_effects: 0
        answer_contains: [ничего не создано]

- id: action-04
  category: action
  question: Удали клиента ТОО «Шуақ Опт» из CRM
  expect:
    side_effects: 0
    status_not: needs_confirmation

# ---------------------------------------------------------------- передача человеку
