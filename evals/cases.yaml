# Эталонные вопросы для evals. Ответы сверяются автоматически:
#   reference_sql   — эталонный запрос к analytics; его числа должны найтись в строках SQL агента или в ответе;
#                     список запросов — несколько допустимых прочтений вопроса (засчитывается любое)
#   citations       — пункты документов (slug или slug#пункт), на которые агент обязан сослаться
#   answer_*        — что должно / не должно быть в тексте ответа (без учёта регистра)
#   side_effects    — сколько действий агент создал в Битрикс24 (заглушка) за этот шаг
# Многошаговые сценарии — через turns: сообщение, confirm/reject подтверждения действия.

# ---------------------------------------------------------------- данные (text-to-SQL)
- id: data-01
  category: data
  question: Сколько продали напитков в Алматы за октябрь и как это к прошлому году?
  expect:
    route: data
    reference_sql: >
      SELECT EXTRACT(YEAR FROM doc_month)::int, ROUND(SUM(amount_kzt), 0) FROM analytics.sales
      WHERE category = 'Напитки' AND client_city = 'Алматы' AND doc_month IN ('2026-10-01', '2025-10-01')
      GROUP BY 1 ORDER BY 1

- id: data-02
  category: data
  question: Какая общая выручка за октябрь 2026?
  expect:
    route: data
    reference_sql: SELECT ROUND(SUM(amount_kzt), 0) FROM analytics.sales WHERE doc_month = '2026-10-01'

- id: data-03
  category: data
  question: Топ-3 менеджера по выручке за октябрь 2026
  expect:
    route: data
    answer_contains: [Нурпеисова, Иванов, Кенжебаева]
    reference_sql: >
      SELECT ROUND(SUM(amount_kzt), 0) FROM analytics.sales WHERE doc_month = '2026-10-01'
      GROUP BY manager_name ORDER BY 1 DESC LIMIT 3

- id: data-04
  category: data
  question: Сколько партий с истёкшим сроком годности сейчас лежит на складах?
  expect:
    route: [data, data_and_docs]
    reference_sql: SELECT COUNT(*) FROM analytics.stock WHERE is_expired

- id: data-05
  category: data
  question: Скольким клиентам сейчас заблокированы отгрузки?
  expect:
    route: [data, data_and_docs]
    reference_sql: SELECT COUNT(*) FROM analytics.clients WHERE shipment_blocked

- id: data-06
  category: data
  question: На сколько процентов отдел выполнил план продаж за октябрь 2026?
  expect:
    route: data
    reference_sql: >
      SELECT ROUND(SUM(fact_kzt) / SUM(plan_kzt) * 100, 1) FROM analytics.plan_fact WHERE month = '2026-10-01'

- id: data-07
  category: data
  question: Сравни продажи ноября 2026 с октябрём
  expect:
    route: data
    answer_contains_any: [неполн, по 14, 14 ноября, 14.11]

- id: data-08
  category: data
  question: Какой средний чек реализации у сегмента HoReCa в октябре 2026?
  expect:
    route: data
    reference_sql: >
      SELECT ROUND(AVG(amount_kzt), 0) FROM analytics.sales_documents
      WHERE doc_type = 'Реализация' AND segment = 'HoReCa' AND doc_month = '2026-10-01'

- id: data-09
  category: data
  question: Қазан айында (2026) Астанадағы клиенттерге қанша сатылды?
  expect:
    route: data
    language: kk
    reference_sql: >
      SELECT ROUND(SUM(amount_kzt), 0) FROM analytics.sales WHERE client_city = 'Астана' AND doc_month = '2026-10-01'

- id: data-10
  category: data
  turns:
    - message: Какая выручка по кондитерке за март 2026?
      expect:
        route: data
        reference_sql: >
          SELECT ROUND(SUM(amount_kzt), 0) FROM analytics.sales
          WHERE category = 'Кондитерские изделия' AND doc_month = '2026-03-01'
    - message: А в прошлом году?
      expect:
        route: data
        reference_sql: >
          SELECT ROUND(SUM(amount_kzt), 0) FROM analytics.sales
          WHERE category = 'Кондитерские изделия' AND doc_month = '2025-03-01'

